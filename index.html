<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenFairway — ゴルフスクール管理</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:#f4f6f8;color:#1a2332;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
:root{
  --g9:#0d3d1f;--g7:#16613a;--g6:#1e7f4e;--g5:#27ae6e;--g1:#e8f5ee;--g0:#f0faf4;
  --nav-w:220px;--top-h:56px;--white:#fff;
  --gray50:#f9fafb;--gray100:#f3f4f6;--gray200:#e5e7eb;--gray300:#d1d5db;
  --gray400:#9ca3af;--gray500:#6b7280;--gray600:#4b5563;--gray700:#374151;--gray900:#111827;
  --red:#ef4444;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fffbeb;
  --success:#059669;--success-bg:#ecfdf5;--blue:#2563eb;--blue-bg:#eff6ff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);--shadow:0 2px 8px rgba(0,0,0,.10);--radius:8px
}
#app{display:flex;min-height:100vh}
#sidebar{width:var(--nav-w);background:var(--g7);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
#main-wrap{margin-left:var(--nav-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
#topbar{height:var(--top-h);background:var(--white);border-bottom:1px solid var(--gray200);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:50;flex-shrink:0}
#main-content{flex:1;padding:24px;overflow-y:auto}
.sidebar-logo{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.15);flex-shrink:0}
.logo-icon{width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{color:#fff;font-weight:700;font-size:14px;line-height:1.2}
.logo-sub{color:rgba(255,255,255,.55);font-size:10px}
.sidebar-nav{flex:1;padding:10px 0}
.nav-section{padding:8px 20px 4px;font-size:10px;color:rgba(255,255,255,.4);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;color:rgba(255,255,255,.72);font-size:13px;cursor:pointer;transition:background .15s,color .15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:#fff;font-weight:600}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar-bottom{padding:8px 0;border-top:1px solid rgba(255,255,255,.15);flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700;color:var(--gray900);flex:1}
.search-box{display:flex;align-items:center;gap:8px;background:var(--gray100);border:1px solid var(--gray200);border-radius:6px;padding:6px 12px;width:260px}
.search-box input{background:none;border:none;outline:none;font-size:13px;color:var(--gray700);width:100%}
.topbar-actions{display:flex;align-items:center;gap:8px}
.notif-btn{width:34px;height:34px;border:1px solid var(--gray200);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative}
.notif-badge{position:absolute;top:3px;right:3px;width:14px;height:14px;background:var(--red);border-radius:50%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--gray200);border-radius:6px;background:#fff;font-size:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--g6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.avatar.lg{width:48px;height:48px;font-size:18px}
/* Cards */
.card{background:#fff;border:1px solid var(--gray200);border-radius:var(--radius)}
.card-header{padding:14px 16px;border-bottom:1px solid var(--gray100);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:700;color:var(--gray900);display:flex;align-items:center;gap:6px}
.card-body{padding:16px}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid var(--gray200);border-radius:var(--radius);padding:14px 16px}
.kpi-label{font-size:10.5px;color:var(--gray500);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.kpi-icon{font-size:17px}
.kpi-value{font-size:26px;font-weight:800;color:var(--gray900);line-height:1;margin-bottom:4px}
.kpi-sub{font-size:11px;color:var(--gray500)}
.kpi-sub.up{color:var(--success)}
.kpi-sub.dn{color:var(--red)}
.kpi-sub.warn{color:var(--amber)}
/* Section */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:13px;font-weight:700;color:var(--gray900)}
.count-chip{background:var(--g1);color:var(--g7);font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:5px}
.count-chip.red{background:var(--red-bg);color:var(--red)}
.see-all{font-size:12px;color:var(--g6);display:flex;align-items:center;gap:2px;cursor:pointer}
/* Grid */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.dash-third{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:18px}
.col-span-2{grid-column:1/-1}
/* Table */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:10.5px;font-weight:600;color:var(--gray500);text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--gray200);background:var(--gray50);white-space:nowrap}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--gray100);font-size:12.5px;color:var(--gray700)}
.data-table tr:last-child td{border-bottom:none}
.data-table tbody tr:hover td{background:var(--gray50);cursor:pointer}
.data-table .name-cell{font-weight:600;color:var(--gray900)}
/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.green{background:var(--success-bg);color:var(--success)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.badge.gray{background:var(--gray100);color:var(--gray500)}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;border:none;transition:all .15s}
.btn-primary{background:var(--g6);color:#fff}
.btn-primary:hover{background:var(--g7)}
.btn-outline{background:#fff;border:1px solid var(--gray300);color:var(--gray700)}
.btn-outline:hover{background:var(--gray50)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:var(--red);color:#fff}
/* Calendar */
.cal-wrap{overflow-x:auto}
.cal-table{width:100%;border-collapse:collapse;min-width:680px}
.cal-table th{font-size:11px;color:var(--gray500);padding:8px 4px;text-align:center;border-bottom:1px solid var(--gray200);font-weight:600}
.cal-table th.today-col{color:var(--g6);font-weight:700}
.cal-table td{padding:4px;border-bottom:1px solid var(--gray100);border-right:1px solid var(--gray100);vertical-align:top}
.cal-table td:first-child{border-right:2px solid var(--gray200);background:var(--gray50);padding:8px 12px;white-space:nowrap}
.coach-row-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--gray700)}
.slot{border-radius:6px;padding:6px;font-size:11px;text-align:center;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.slot.empty{background:var(--gray50);color:var(--gray300);font-size:10px}
.slot.low{background:#fef9c3;color:#854d0e}
.slot.mid{background:var(--success-bg);color:#065f46}
.slot.high{background:#bbf7d0;color:#065f46}
.slot.full{background:#fee2e2;color:#991b1b}
.slot.off{background:var(--gray100);color:var(--gray400)}
.slot-count{font-size:17px;font-weight:800}
.slot-rate{font-size:10px;opacity:.8}
/* Filter */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-chip{padding:5px 12px;border:1px solid var(--gray300);border-radius:16px;font-size:12px;color:var(--gray600);background:#fff;cursor:pointer;transition:all .15s}
.filter-chip:hover{border-color:var(--g5)}
.filter-chip.active{background:var(--g7);color:#fff;border-color:var(--g7)}
.search-input{padding:7px 12px;border:1px solid var(--gray300);border-radius:6px;font-size:13px;outline:none;width:220px}
.search-input:focus{border-color:var(--g5)}
/* Alerts */
.alert-item{border-radius:6px;padding:10px 14px;display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.alert-item.warn{background:var(--amber-bg);border-left:3px solid var(--amber)}
.alert-item.danger{background:var(--red-bg);border-left:3px solid var(--red)}
.alert-item.info{background:var(--blue-bg);border-left:3px solid var(--blue)}
.alert-icon{font-size:15px;margin-top:1px}
.alert-body{flex:1}
.alert-title{font-weight:700;font-size:12px;color:var(--gray900);margin-bottom:2px}
.alert-desc{font-size:11px;color:var(--gray600)}
.alert-link{font-size:11px;color:var(--g6);font-weight:600;cursor:pointer;white-space:nowrap}
/* Plan cards */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.plan-card{background:#fff;border:1px solid var(--gray200);border-radius:var(--radius);padding:18px;position:relative}
.plan-card.popular::before{content:'人気';position:absolute;top:10px;right:10px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.plan-name{font-size:14px;font-weight:700;color:var(--gray900);margin-bottom:4px}
.plan-fee{font-size:22px;font-weight:800;color:var(--g6);margin-bottom:12px}
.plan-feat{font-size:12px;color:var(--gray600);display:flex;align-items:center;gap:5px;margin-bottom:4px}
/* Lesson record */
.lr-item{padding:12px 0;border-bottom:1px solid var(--gray100)}
.lr-item:last-child{border-bottom:none}
.lr-date{font-size:11px;color:var(--gray500);margin-bottom:3px}
.lr-name{font-size:13px;font-weight:600;color:var(--gray900)}
.lr-meta{font-size:12px;color:var(--gray600);margin-top:2px}
.lr-memo{font-size:12px;color:var(--gray700);background:var(--gray50);border-radius:4px;padding:6px 8px;margin-top:6px;border-left:2px solid var(--g5)}
/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--gray200);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;color:var(--gray500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;transition:all .15s}
.tab.active{color:var(--g6);border-bottom-color:var(--g6);font-weight:700}
/* Form */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--gray700);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--gray300);border-radius:6px;font-size:13px;outline:none;background:#fff}
.form-group input:focus,.form-group select:focus{border-color:var(--g5)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.sf-modal{background:#fff;border-radius:10px;width:100%;max-width:460px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.sf-modal-header{padding:16px 20px;border-bottom:1px solid var(--gray100);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.sf-modal-close{background:none;border:none;font-size:18px;color:var(--gray400);cursor:pointer}
.sf-modal-body{padding:20px;overflow-y:auto;flex:1}
.sf-modal-footer{padding:14px 20px;border-top:1px solid var(--gray100);display:flex;justify-content:flex-end;gap:8px}
/* Progress bar */
.progress-bar{height:6px;background:var(--gray200);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s}
/* Utils */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-4{gap:4px}.gap-8{gap:8px}.gap-12{gap:12px}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-muted{color:var(--gray500)}.fw-bold{font-weight:700}
#loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:999}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--gray900);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:all .3s;z-index:1000;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
  .dash-grid,.dash-third{grid-template-columns:1fr}
  #sidebar{transform:translateX(-100%);transition:transform .25s;width:var(--nav-w)}
  #sidebar.open{transform:translateX(0)}
  #sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
  #sidebar-backdrop.show{display:block}
  #main-wrap{margin-left:0}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  #menu-btn{display:block!important}
  #topbar-logo{display:flex!important}
  #topbar-search{display:none!important}
  .search-box{display:none}
  .user-chip > div:last-child{display:none}
  #bottom-nav{display:flex!important}
  #main-content{padding:16px;padding-bottom:72px}
  .topbar-title{font-size:14px}
}
/* ボトムナビ（モバイル） */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid var(--gray200);z-index:90;justify-content:space-around;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;cursor:pointer;color:var(--gray400);font-size:10px;flex:1;border:none;background:none}
.bn-item.active{color:var(--g6)}
.bn-icon{font-size:20px}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">⛳</div>
      <div>
        <div class="logo-text">GreenFairway</div>
        <div class="logo-sub">ゴルフスクール管理</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">メイン</div>
      <div class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')"><span class="nav-icon">📊</span>ダッシュボード</div>
      <div class="nav-item" data-view="calendar" onclick="navigate('calendar')"><span class="nav-icon">📅</span>予約カレンダー</div>
      <div class="nav-item" data-view="members" onclick="navigate('members')"><span class="nav-icon">👥</span>会員管理</div>
      <div class="nav-section">業務</div>
      <div class="nav-item" data-view="lessons" onclick="navigate('lessons')"><span class="nav-icon">📝</span>レッスン記録</div>
      <div class="nav-item" data-view="payments" onclick="navigate('payments')"><span class="nav-icon">💳</span>決済管理</div>
      <div class="nav-section">設定</div>
      <div class="nav-item" data-view="plans" onclick="navigate('plans')"><span class="nav-icon">📋</span>プラン管理</div>
      <div class="nav-item" data-view="coaches" onclick="navigate('coaches')"><span class="nav-icon">🏌️</span>コーチ管理</div>
    </div>
    <div class="sidebar-bottom">
      <div class="nav-item"><span class="nav-icon">⚙️</span>設定</div>
    </div>
  </nav>

  <div id="main-wrap">
    <header id="topbar">
      <!-- モバイル用ハンバーガー -->
      <button id="menu-btn" onclick="toggleSidebar()" style="display:none;background:none;border:none;font-size:22px;padding:4px 8px 4px 0;color:var(--gray700)">☰</button>
      <!-- ロゴ（PCはサイドバーにあるのでモバイルのみ表示） -->
      <div id="topbar-logo" style="display:none;align-items:center;gap:8px;margin-right:8px">
        <div style="width:28px;height:28px;background:var(--g6);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px">⛳</div>
        <div style="line-height:1.2">
          <div style="font-size:12px;font-weight:800;color:var(--g7)">GreenFairway</div>
          <div style="font-size:9px;color:var(--gray400)">ゴルフスクール管理</div>
        </div>
      </div>
      <div class="topbar-title" id="topbar-title">ダッシュボード</div>
      <div class="search-box" id="topbar-search">
        <span style="color:var(--gray400)">🔍</span>
        <input type="text" placeholder="会員名で検索" id="global-search" oninput="globalSearch(this.value)">
      </div>
      <div class="topbar-actions">
        <button class="notif-btn" onclick="navigate('payments')">
          🔔<span class="notif-badge" id="notif-count">0</span>
        </button>
        <div class="user-chip">
          <div class="avatar">ル</div>
          <div>
            <div style="font-weight:700;font-size:12px">ルイ コーチ</div>
            <div style="font-size:10px;color:var(--gray500)">管理者</div>
          </div>
        </div>
      </div>
    </header>
    <main id="main-content"></main>
  </div>
</div>

<!-- Edit Member Modal -->
<div class="modal-overlay" id="editModal">
  <div class="sf-modal">
    <div class="sf-modal-header">会員情報を編集<button class="sf-modal-close" onclick="closeEditModal()">✕</button></div>
    <div class="sf-modal-body">
      <div class="form-group"><label>お名前 *</label><input type="text" id="editName"></div>
      <div class="form-group"><label>メールアドレス *</label><input type="email" id="editEmail"></div>
      <div class="form-group"><label>プラン（月あたりの回数）</label>
        <select id="editPlan">
          <option value="0">レッスンパック（月次付与なし）</option>
          <option value="1">月1回</option><option value="2">月2回</option>
          <option value="3">月3回</option><option value="4">月4回</option>
          <option value="6">月6回</option><option value="8">月8回</option>
        </select>
      </div>
      <div class="form-group"><label>契約開始日 *</label><input type="date" id="editStartDate"></div>
      <div class="form-group"><label>月額料金 (¥)</label><input type="number" id="editMonthlyFee" placeholder="0"></div>
      <div class="form-group"><label>備考</label><input type="text" id="editNote"></div>
      <div class="form-group"><label>LINE ID</label><input type="text" id="editLineId" placeholder="例: @username"></div>
      <div class="form-group"><label>Instagram</label><input type="text" id="editInstagramId" placeholder="例: @username"></div>
    </div>
    <div class="sf-modal-footer">
      <button class="btn btn-outline" onclick="closeEditModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="submitEditMember()">保存</button>
    </div>
  </div>
</div>

<!-- Add Member Modal -->
<div class="modal-overlay" id="addModal">
  <div class="sf-modal">
    <div class="sf-modal-header" id="addModalTitle">新規登録<button class="sf-modal-close" onclick="closeAddModal()">✕</button></div>
    <div class="sf-modal-body">
      <div class="form-group"><label>種別 *</label>
        <select id="newMemberType" onchange="toggleAddModalFields()">
          <option value="trial">体験レッスン（新規見込み）</option>
          <option value="subscription">サブスク会員</option>
        </select>
      </div>
      <div class="form-group"><label>お名前 *</label><input type="text" id="newName"></div>
      <div class="form-group"><label>メールアドレス</label><input type="email" id="newEmail"></div>
      <div id="trialFields">
        <div class="form-group"><label>体験レッスン日 *</label><input type="date" id="newTrialDate"></div>
      </div>
      <div id="subscriptionFields" style="display:none">
        <div class="form-group"><label>プラン</label>

function genWeekSchedule() {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow===0?6:dow-1));
  const week = Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });
  const caps = [6,6,6,6,6,4,0];
  return COACHES.map(c=>({
    coach:c,
    days:week.map((d,i)=>{
      if(c.id===3&&i>=5) return {date:d,used:0,cap:0,off:true};
      const cap=caps[i];
      if(cap===0) return {date:d,used:0,cap:0,off:true};
      const used=Math.floor(Math.random()*cap);
      return {date:d,used,cap,off:false};
    })
  }));
}
const WEEK_SCHEDULE = genWeekSchedule();

// ── Helpers ──────────────────────────────────────────────────────
function toDateStr(d){ return d.toISOString().split('T')[0]; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addMonths(s,n){ const d=parseDate(s); d.setMonth(d.getMonth()+n); return toDateStr(d); }
function formatDate(s){ const d=parseDate(s); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }
function formatDateJP(s){ const d=parseDate(s); return `${d.getMonth()+1}月${d.getDate()}日`; }
function fmtFee(n){ return n>0?'¥'+n.toLocaleString():'—'; }
function showLoading(msg=''){ document.getElementById('loading-overlay').style.display='flex'; }
function hideLoading(){ document.getElementById('loading-overlay').style.display='none'; }
function showToast(msg,ms=2500){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),ms); }

function computePeriods(member, allLessons, today){
  const todayStr = toDateStr(today||new Date());
  const periods = [];
  let ps = member.startDate;
  for(let i=0;i<60;i++){
    const pe = addMonths(ps,1);
    if(ps>todayStr) break;
    const pl = (allLessons||lessons).filter(l=>l.email.toLowerCase()===member.email.toLowerCase()&&l.date>=ps&&l.date<pe);
    const isFirst = periods.length===0;
    const carryIn = isFirst?(member.carryOver||0):Math.max(0,periods[periods.length-1].allotted-periods[periods.length-1].used);
    const allotted = member.plan>0 ? member.plan+carryIn : (isFirst?member.carryOver:carryIn);
    periods.push({start:ps,end:pe,allotted,carryIn,used:pl.length,remaining:Math.max(0,allotted-pl.length),lessons:pl});
    ps = pe;
  }
  return periods;
}
function getCurrentPeriod(m){ const ps=computePeriods(m); return ps[ps.length-1]||null; }
function getTotalRemaining(m){ const c=getCurrentPeriod(m); return c?c.remaining:0; }
function getNextRenewal(m){ const c=getCurrentPeriod(m); return c?c.end:''; }

function getPaymentStatus(memberId, yearMonth){
  return payments.find(p=>p.memberId===memberId&&p.yearMonth===yearMonth);
}
function currentYearMonth(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

// ── Calendar ──────────────────────────────────────────────────────
function renderCalendarTable(compact=false){
  const today = toDateStr(new Date());
  const DOW = ['日','月','火','水','木','金','土'];
  const headers = WEEK_SCHEDULE[0].days.map(s=>{
    const ds=toDateStr(s.date);
    const d=s.date;
    const isToday=ds===today;
    return `<th class="day-col ${isToday?'today-col':''}">${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})</th>`;
  }).join('');

  const rows = WEEK_SCHEDULE.map(cs=>{
    const slots = cs.days.map(s=>{
      if(s.off) return `<td><div class="slot off">休み</div></td>`;
      if(s.cap===0) return `<td><div class="slot empty">—</div></td>`;
      const pct=Math.round(s.used/s.cap*100);
      const cls=pct>=90?'full':pct>=70?'high':pct>=50?'mid':'low';
      return `<td><div class="slot ${cls}"><div class="slot-count">${s.used}</div><div class="slot-rate">稼働 ${pct}%</div></div></td>`;
    }).join('');
    return `<tr>
      <td><div class="coach-row-label">
        <div class="avatar" style="background:${cs.coach.color};width:26px;height:26px;font-size:11px">${cs.coach.avatar}</div>
        ${cs.coach.name}
      </div></td>
      ${slots}
    </tr>`;
  }).join('');

  return `<table class="cal-table"><thead><tr><th style="min-width:120px">コーチ</th>${headers}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderCalendar(){
  const today = new Date();
  const todayStr = toDateStr(today);
  const DOW = ['日','月','火','水','木','金','土'];

  // 今週月曜〜日曜
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow===0?6:dow-1));
  const week = Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });
  const weekStrs = week.map(d=>toDateStr(d));

  // アクティブなサブスク会員のみ
  const activeMembers = members
    .filter(m=>m.memberType==='subscription'&&m.status==='active')
    .sort((a,b)=>getTotalRemaining(a)-getTotalRemaining(b));

  // 凡例
  const legend = `<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--gray500);margin-top:10px">
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--g5);border-radius:50%;margin-right:4px"></span>受講済</span>
    <span><span style="display:inline-block;width:10px;height:10px;border:2px dashed var(--gray300);border-radius:50%;margin-right:4px"></span>未予約</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--red);border-radius:50%;margin-right:4px;opacity:.7"></span>残数0</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:var(--amber);border-radius:50%;margin-right:4px;opacity:.8"></span>残数1〜2</span>
  </div>`;

  // ヘッダー
  const headers = week.map((d,i)=>{
    const ds=weekStrs[i];
    const isToday=ds===todayStr;
    const isPast=d<today&&!isToday;
    return `<th style="min-width:68px;text-align:center;${isToday?'color:var(--g6);font-weight:800':isPast?'color:var(--gray300)':''}">
      <div>${DOW[d.getDay()]}</div>
      <div style="font-size:15px;font-weight:700">${d.getDate()}</div>
      ${isToday?'<div style="width:6px;height:6px;background:var(--g5);border-radius:50%;margin:2px auto 0"></div>':''}
    </th>`;
  }).join('');

  // 会員行
  const rows = activeMembers.map(m=>{
    const cur = getCurrentPeriod(m);
    const rem = getTotalRemaining(m);
    const remClass = rem===0?'color:var(--red);font-weight:800':rem<=2?'color:var(--amber);font-weight:700':'color:var(--gray700)';
    const usedThisPeriod = cur ? cur.used : 0;
    const allotted = cur ? cur.allotted : 0;

    const cells = week.map((d,i)=>{
      const ds = weekStrs[i];
      const isPast = d<today && ds!==todayStr;
      const isToday = ds===todayStr;
      // この日のレッスン
      const hasLesson = lessons.some(l=>l.email.toLowerCase()===m.email.toLowerCase()&&l.date===ds);
      // 期間外かチェック
      const inPeriod = cur && ds>=cur.start && ds<cur.end;

      let cell='';
      if(!inPeriod){
        cell=`<div style="width:32px;height:32px;margin:auto;background:var(--gray100);border-radius:6px"></div>`;
      } else if(hasLesson){
        cell=`<div style="width:32px;height:32px;margin:auto;background:var(--g5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px" title="${formatDate(ds)} 受講済">✓</div>`;
      } else if(isPast){
        cell=`<div style="width:32px;height:32px;margin:auto;border:2px dashed var(--gray200);border-radius:50%"></div>`;
      } else {
        cell=`<div style="width:32px;height:32px;margin:auto;border:2px dashed ${rem<=0?'var(--red)':'var(--gray300)'};border-radius:50%;${isToday?'border-color:var(--g5)':''}"></div>`;
      }
      return `<td style="text-align:center;padding:6px 2px;${isToday?'background:var(--g0)':''}">${cell}</td>`;
    }).join('');

    return `<tr onclick="navigate('member_detail',${m.id})" style="cursor:pointer">
      <td style="padding:8px 12px;border-bottom:1px solid var(--gray100);min-width:130px">
        <div style="font-weight:600;font-size:13px;color:var(--gray900)">${m.name}</div>
        <div style="font-size:11px;color:var(--gray400);margin-top:1px">${m.plan===0?'パック':`月${m.plan}回`} · <span style="${remClass}">残${rem}回</span></div>
        ${cur?`<div style="margin-top:4px"><div style="height:4px;background:var(--gray200);border-radius:2px;width:80px"><div style="height:4px;background:${rem===0?'var(--red)':rem<=2?'var(--amber)':'var(--g5)'};border-radius:2px;width:${allotted>0?Math.min(100,usedThisPeriod/allotted*100):0}%"></div></div></div>`:''}
      </td>
      ${cells}
    </tr>`;
  }).join('');

  // 未予約アラート（今週残日数で予約必要な人）
  const needBook = activeMembers.filter(m=>{
    const rem=getTotalRemaining(m);
    const usedThisWeek=week.filter(d=>lessons.some(l=>l.email.toLowerCase()===m.email.toLowerCase()&&l.date===toDateStr(d))).length;
    return rem>0&&usedThisWeek===0;
  });

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:16px;font-weight:800;color:var(--gray900)">今週の会員別レッスン状況</div>
      <div style="font-size:12px;color:var(--gray500);margin-top:2px">${monday.getMonth()+1}/${monday.getDate()}（月）〜 ${week[6].getMonth()+1}/${week[6].getDate()}（日）</div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 体験・新規登録</button>
  </div>

  ${needBook.length>0?`<div class="alert-item warn" style="margin-bottom:14px">
    <div class="alert-icon">📋</div>
    <div class="alert-body">
      <div class="alert-title">今週まだ未予約の会員が ${needBook.length} 名います</div>
      <div class="alert-desc">${needBook.slice(0,5).map(m=>m.name).join('、')}${needBook.length>5?`他${needBook.length-5}名`:''}</div>
    </div>
  </div>`:''}

  <div class="card">
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr style="background:var(--gray50);border-bottom:2px solid var(--gray200)">
            <th style="padding:10px 12px;text-align:left;font-size:11px;color:var(--gray500);font-weight:700;min-width:130px">会員名 / 進捗</th>
            ${headers}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${legend}
    <div style="padding:8px 0 0;font-size:11px;color:var(--gray400)">※ 行をタップすると会員詳細に移動します</div>
  </div>

  <!-- 期間別サマリー -->
  <div class="card" style="margin-top:16px">
    <div class="card-header"><div class="card-title">📊 今月の使用状況サマリー</div></div>
    <table class="data-table">
      <thead><tr><th>会員名</th><th>期間</th><th>権利</th><th>使用</th><th>残</th><th>進捗</th><th>更新まで</th></tr></thead>
      <tbody>
        ${activeMembers.map(m=>{
          const cur=getCurrentPeriod(m);
          const rem=getTotalRemaining(m);
          const ren=getNextRenewal(m);
          const days=ren?Math.ceil((parseDate(ren)-today)/86400000):99;
          const pct=cur&&cur.allotted>0?Math.min(100,Math.round(cur.used/cur.allotted*100)):0;
          const bc=rem===0?'red':rem<=2?'amber':'green';
          return `<tr onclick="navigate('member_detail',${m.id})" style="cursor:pointer">
            <td class="name-cell">${m.name}</td>
            <td class="text-xs text-muted">${cur?formatDateJP(cur.start)+'〜'+formatDateJP(cur.end):'-'}</td>
            <td class="text-muted">${cur?cur.allotted:'-'}回</td>
            <td>${cur?cur.used:'-'}回</td>
            <td><span class="badge ${bc}">${rem}回</span></td>
            <td><div style="display:flex;align-items:center;gap:6px">
              <div style="width:60px;height:5px;background:var(--gray200);border-radius:3px"><div style="height:5px;background:${rem===0?'var(--red)':rem<=2?'var(--amber)':'var(--g5)'};border-radius:3px;width:${pct}%"></div></div>
              <span class="text-xs text-muted">${pct}%</span>
            </div></td>
            <td class="text-xs ${days<=7?'':'text-muted'}" style="${days<=7?'color:var(--amber);font-weight:700':''}">${days}日</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

// ── Members ───────────────────────────────────────────────────────
function renderMembers(){
  const today=new Date();
  const ym=currentYearMonth();
  let list=members.filter(m=>{
    if(memberFilter==='subscription') return m.memberType==='subscription'&&m.status==='active';
    if(memberFilter==='trial') return m.memberType==='trial';
    if(memberFilter==='inactive') return m.status==='inactive';
    if(memberFilter==='alert'){
      const ren=getNextRenewal(m); if(!ren) return false;
      const days=Math.ceil((parseDate(ren)-today)/86400000);
      return days<=7||getTotalRemaining(m)===0;
    }
    if(memberFilter==='unpaid') return m.plan>0&&m.monthlyFee>0&&!getPaymentStatus(m.id,ym);
    return true;
  });
  if(memberSearch) list=list.filter(m=>m.name.toLowerCase().includes(memberSearch.toLowerCase())||m.email.toLowerCase().includes(memberSearch.toLowerCase()));

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div>
      <div class="filter-bar" style="margin-bottom:0">
        ${[['all','すべて'],['subscription','サブスク'],['trial','体験中'],['inactive','休止中'],['alert','要確認'],['unpaid','未払い']].map(([v,l])=>
          `<div class="filter-chip ${memberFilter===v?'active':''}" onclick="memberFilter='${v}';render()">${l}</div>`
        ).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <input class="search-input" type="text" placeholder="名前・メールで検索" value="${memberSearch}" oninput="memberSearch=this.value;render()">
      <button class="btn btn-primary" onclick="openAddModal()">+ 新規会員</button>
    </div>
  </div>
  <div class="card">
    <table class="data-table">
      <thead><tr><th>会員名</th><th>メール</th><th>プラン</th><th>月額</th><th>残回数</th><th>更新日</th><th>支払</th><th>ステータス</th><th></th></tr></thead>
      <tbody>
        ${list.map(m=>{
          const rem=getTotalRemaining(m);
          const ren=getNextRenewal(m);
          const days=ren?Math.ceil((parseDate(ren)-today)/86400000):99;
          const paid=getPaymentStatus(m.id,ym);
          const bc=rem===0?'red':rem<=2?'amber':'green';
          return `<tr onclick="navigate('member_detail',${m.id})">
            <td class="name-cell">${m.name}</td>
            <td class="text-xs text-muted">${m.email}</td>
            <td>${m.plan===0?'パック':`月${m.plan}回`}</td>
            <td>${fmtFee(m.monthlyFee)}</td>
            <td><span class="badge ${bc}">${rem}回</span></td>
            <td class="text-xs">${ren?formatDate(ren):'-'}${days<=7&&m.plan>0?` <span class="badge amber">${days}日</span>`:''}</td>
            <td>${m.plan>0&&m.monthlyFee>0?(paid?'<span class="badge green">済</span>':'<span class="badge red">未払</span>'):'<span class="badge gray">—</span>'}</td>
            <td><span class="badge ${m.status==='active'?'green':'gray'}">${m.status==='active'?'受講中':'休止中'}</span></td>
            <td><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openEditModal(${m.id})">編集</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    ${list.length===0?`<div style="padding:40px;text-align:center;color:var(--gray400)">会員が見つかりません</div>`:''}
  </div>`;
}

async function revertHistory(histId, fieldName, encodedOldVal, memberId){
  if(!confirm(`「${fieldName}」を元の値に戻しますか？`)) return;
  const oldVal=decodeURIComponent(encodedOldVal);
  const dbFieldMap={'名前':'name','メール':'email','プラン':'plan','開始日':'start_date','月額':'monthly_fee','備考':'note','LINE ID':'line_id','Instagram':'instagram_id'};
  const dbField=dbFieldMap[fieldName];
  if(!dbField){ alert('この項目は自動ロールバックできません'); return; }
  showLoading();
  try {
    const val=dbField==='plan'||dbField==='monthly_fee'?parseInt(oldVal):oldVal;
    await sbPatch('members',memberId,{[dbField]:val});
    const m=members.find(m=>m.id===memberId);
    await sbPost('edit_history',{table_name:'members',record_id:memberId,field_name:fieldName,old_value:'(ロールバック)',new_value:oldVal,member_name:m?.name||''});
    await fetchData(); closeHistoryModal(); showToast('✓ 元に戻しました');
  } catch(e){ showToast('⚠ 失敗しました'); } finally { hideLoading(); }
}

  const planStr=m.plan>0?`月${m.plan}回プラン`:'レッスンパック';
  const cur=getCurrentPeriod(m);
  const needed=cur?Math.max(0,cur.allotted-cur.used):0;
  let msg='';
  if(type==='reminder'){
    msg=`${m.name}さん、こんにちは！ルイコーチです🏌️\n\n現在のレッスン残数は【${rem}回】です。\n更新日は ${renewal?formatDate(renewal):''}（あと${days}日）となっております。\n${needed>0?`更新前にあと${needed}回のご予約をお待ちしております！\n`:'今月分はすべてご予約済みです✨\n'}\nご不明な点はお気軽にご連絡ください😊`;
  } else if(type==='renewal'){
    msg=`${m.name}さん、こんにちは！ルイコーチです🏌️\n\n${renewal?formatDate(renewal):''}に${planStr}の更新となります。\n引き続きよろしくお願いいたします！\n\n来月も${m.plan>0?m.plan+'回分':'パック残数分'}のレッスンをご利用いただけます。\nご予約はお早めに📅`;
  } else {
    msg=`${m.name}さん、こんにちは！ルイコーチです🏌️\n\n現在のレッスン残数が【0回】となっております。\n${m.plan>0?`次回更新日（${renewal?formatDate(renewal):''}）まであと${days}日です。`:'レッスンパックの追加をご検討ください。'}\n\nご不明な点はお気軽にご連絡ください😊`;
  }
  document.getElementById('lineMsgBox').value=msg;
}
function copyLineMsg(){
  const t=document.getElementById('lineMsgBox').value;
  if(!t||t.startsWith('上の')) return;
  navigator.clipboard.writeText(t).then(()=>showToast('✓ コピーしました'));
}

// ── Global search ─────────────────────────────────────────────────
function globalSearch(q){
  if(q.length<1) return;
  memberSearch=q; memberFilter='all';
  navigate('members');
}

// ── Fetch data ────────────────────────────────────────────────────
async function fetchData(){
  try {
    const [mRows, lRows, pRows] = await Promise.all([
      sbGet('members','order=name.asc'),
      sbGet('lessons','order=date.desc'),
      sbGet('payments','order=created_at.desc').catch(()=>[])
    ]);
    members=mRows.map(normMember);
    lessons=lRows.map(normLesson);
    payments=pRows.map?pRows.map(normPayment):[];
  } catch(e){ console.error('Fetch error',e); }
}

// ── Init ──────────────────────────────────────────────────────────
(async()=>{
  showLoading();
  await fetchData();
  hideLoading();
  navigate('dashboard');
})();
</script>
